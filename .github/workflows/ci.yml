name: Brainmerge CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Verify committed build matches TypeScript source
        run: git diff --exit-code -- build/
      - run: npm run package:yandex
      - name: Install Chromium for packaged runtime smoke
        run: npx playwright install --with-deps chromium
      - name: Run packaged runtime smoke
        run: npm run smoke:runtime
      - name: Run Campaign shell smoke
        run: npm run smoke:campaign
      - name: Run Campaign Restore + Mastery smoke
        run: npm run smoke:campaign:final
      - name: Run packaged RC smoke
        run: npm run smoke:rc
      - name: Run packaged motion smoke
        run: npm run smoke:motion
      - name: Run recovery regression smoke
        run: npm run smoke:regression
      - name: Run packaged RU runtime smoke
        run: npm run smoke:locale
      - name: Run packaged Yandex adapter smoke
        run: npm run smoke:yandex
      - uses: actions/upload-artifact@v4
        with:
          name: brainmerge-yandex
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: brainmerge-runtime-screenshots
          path: runtime-artifacts/
          if-no-files-found: error
