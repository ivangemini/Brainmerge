name: Brainmerge CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run package:yandex
      - name: Install Chromium for packaged runtime smoke
        run: npx playwright install --with-deps chromium
      - name: Run packaged runtime smoke
        run: npm run smoke:runtime
      - uses: actions/upload-artifact@v4
        with:
          name: brainmerge-yandex
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: brainmerge-runtime-screenshots
          path: runtime-artifacts/
          if-no-files-found: error
