name: Brainmerge CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run package:yandex
      - uses: actions/upload-artifact@v4
        with:
          name: brainmerge-yandex
          path: dist/
          if-no-files-found: error
