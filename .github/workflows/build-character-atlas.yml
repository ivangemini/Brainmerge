name: Build full character atlas

on:
  push:
    paths:
      - '.github/workflows/build-character-atlas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build canonical 6x3 T1-T18 atlas
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('public/assets/characters')
          atlas_path = root / 'character-atlas.webp'
          old = Image.open(atlas_path).convert('RGBA')

          if old.size == (360, 180):
              print('Canonical 6x3 atlas already exists; no rebuild needed.')
              raise SystemExit(0)
          if old.size != (240, 120):
              raise SystemExit(f'Unexpected source atlas size: {old.size}; expected 240x120 or 360x180')

          slot = 60
          old_slot_for_tier = {
              2: 0,
              3: 2,
              4: 3,
              5: 4,
              6: 5,
              7: 6,
              8: 7,
          }
          standalone = {
              1: 'toilet-buddy-form-a.webp',
              9: 'brr-brr-patapim.webp',
              10: 'boneca-ambalabu.webp',
              11: 'cappuccino-assassino.webp',
              12: 'frigo-camelo.webp',
              13: 'lirili-larila.webp',
              14: 'chimpanzini-bananini.webp',
              15: 'cocofanto-elefanto.webp',
              16: 'bombombini-gusini.webp',
              17: 'trippi-troppi.webp',
              18: 'la-vacca-saturno-saturnita.webp',
          }

          canvas = Image.new('RGBA', (slot * 6, slot * 3), (0, 0, 0, 0))
          for tier in range(1, 19):
              if tier in old_slot_for_tier:
                  index = old_slot_for_tier[tier]
                  sx = (index % 4) * slot
                  sy = (index // 4) * slot
                  tile = old.crop((sx, sy, sx + slot, sy + slot))
              else:
                  source = Image.open(root / standalone[tier]).convert('RGBA')
                  tile = source.resize((slot, slot), Image.Resampling.LANCZOS)

              dx = ((tier - 1) % 6) * slot
              dy = ((tier - 1) // 6) * slot
              canvas.alpha_composite(tile, (dx, dy))

          canvas.save(atlas_path, 'WEBP', quality=88, method=6)
          check = Image.open(atlas_path)
          if check.size != (360, 180):
              raise SystemExit(f'Atlas verification failed: {check.size}')
          print(f'Built {atlas_path}: {check.size[0]}x{check.size[1]}')
          PY
      - name: Commit generated atlas
        run: |
          if git diff --quiet -- public/assets/characters/character-atlas.webp; then
            echo 'No atlas change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/characters/character-atlas.webp
          git commit -m 'art: build full T1-T18 character atlas'
          git push origin HEAD:main
